# Ruff: lint what matters, ignore deliberate patterns.
# - BLE001 blind-except: the runner is deliberately resilient (notify-and-continue)
# - DTZ005 naive datetime: local time is intentional (monthly cron, CET)
# - PLW1510/S110-style tolerance: subprocess/try-except-pass are deliberate
line-length = 120
target-version = "py39"  # the floor Python the project must run on

[lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF100"]
ignore = [
  "B017",
  "BLE001",
  "DTZ005",
  "E501",  # long lines: prompt strings and URLs
  # gradual adoption — fix opportunistically, do not add new instances:
  "B007", "B905", "B904", "E741", "UP031",
]
