# Project metadata and tool configuration.
#
# immich-geotag is a set of stdlib-only scripts meant to be run from a
# checkout (`python3 geotag.py ...`): run state lives next to the scripts
# in geotag-data/ and .env, so there are deliberately no console entry
# points. Runtime dependencies: none. Dev tools are pinned here and in
# requirements-dev.txt (keep the two in sync; CI installs the latter).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-geotag"
version = "1.0.0"
description = "Fill missing GPS coordinates in an Immich photo library by recognizing landmarks (add-only)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nicola Ghislotti" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3; python_version >= '3.10'",
  "pytest==8.4.2; python_version < '3.10'",
  "ruff==0.17.0",
]

[project.urls]
Homepage = "https://github.com/pennico/immich-geotag"
Issues = "https://github.com/pennico/immich-geotag/issues"

[tool.setuptools]
py-modules = [
  "cluster_fill",
  "cluster_review_app",
  "gemini_apply",
  "gemini_audit",
  "gemini_candidates",
  "gemini_review_export",
  "geotag",
  "monthly_geotag",
  "similar_fill",
  "time_fill",
  "time_fill_review_app",
]

# Ruff: lint what matters, ignore deliberate patterns.
# - BLE001 blind-except: the runner is deliberately resilient (notify-and-continue)
# - DTZ005 naive datetime: local time is intentional (monthly cron, CET)
# - PLW1510/S110-style tolerance: subprocess/try-except-pass are deliberate
[tool.ruff]
line-length = 120
target-version = "py39"  # the floor Python the project must run on

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF100"]
ignore = [
  "B017",
  "BLE001",
  "DTZ005",
  "E501",  # long lines: prompt strings and URLs
  # gradual adoption — fix opportunistically, do not add new instances:
  "B007", "B905", "B904", "E741", "UP031",
]
